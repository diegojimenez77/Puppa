<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up | SaaSPro</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "outline-variant": "#c1c6d5",
                "inverse-surface": "#2d3038",
                "tertiary-container": "#737575",
                "error-container": "#ffdad6",
                "tertiary": "#5a5c5c",
                "inverse-primary": "#efb0ff",
                "secondary-fixed": "#f8d8ff",
                "error": "#ba1a1a",
                "on-surface-variant": "#414753",
                "surface-container-highest": "#e0e2ec",
                "surface-container-lowest": "#ffffff",
                "on-secondary-container": "#640c87",
                "surface-container-high": "#e6e8f1",
                "on-primary": "#ffffff",
                "surface-container-low": "#f2f3fd",
                "background": "#f9f9ff",
                "surface-container": "#ecedf7",
                "on-tertiary-fixed-variant": "#454747",
                "tertiary-fixed": "#e2e2e2",
                "on-tertiary": "#ffffff",
                "on-background": "#181c22",
                "on-secondary": "#ffffff",
                "on-surface": "#181c22",
                "surface-bright": "#f9f9ff",
                "on-error": "#ffffff",
                "surface-variant": "#e0e2ec",
                "surface": "#f9f9ff",
                "inverse-on-surface": "#eff0fa",
                "surface-dim": "#d8dae3",
                "secondary-fixed-dim": "#ebb2ff",
                "secondary": "#893aab",
                "on-tertiary-fixed": "#1a1c1c",
                "tertiary-fixed-dim": "#c6c6c7",
                "primary-container": "#a64fc4",
                "on-tertiary-container": "#fcfcfc",
                "on-secondary-fixed-variant": "#6e1c91",
                "on-secondary-fixed": "#320047",
                "primary-fixed": "#fad7ff",
                "on-error-container": "#93000a",
                "surface-tint": "#8d36ab",
                "on-primary-fixed-variant": "#721791",
                "on-primary-container": "#fffbff",
                "secondary-container": "#db87fd",
                "primary": "#8a33a9",
                "on-primary-fixed": "#330045",
                "primary-fixed-dim": "#efb0ff",
                "outline": "#717785"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
            "margin-mobile": "20px",
            "xl": "48px",
            "lg": "24px",
            "md": "16px",
            "sm": "8px",
            "xs": "4px",
            "2xl": "64px"
        },
        "fontFamily": {
                "headline": ["Inter"],
                "display": ["Inter"],
                "body": ["Inter"],
                "label": ["Inter"]
        },
        "fontSize": {
            "headline-xl-mobile": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "24px"}],
            "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
            "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}]
        }
    },
    },
  }
</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-interact:active { transform: scale(0.98); transition: transform 0.1s; }
        .input-focus:focus-within { border-color: #8a33a9; ring: 2px; ring-color: rgba(138, 51, 169, 0.2); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body">
<!-- Brand Header -->
<header class="w-full pt-12 pb-8 px-margin-mobile flex flex-col items-center">
<div class="flex items-center gap-xs mb-sm">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="rocket_launch" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<span class="font-headline text-2xl font-bold text-primary">SaaSPro</span>
</div>
<h1 class="font-headline text-headline-xl-mobile text-center text-on-surface mt-md">Create account</h1>
<p class="font-body text-body-md text-on-surface-variant text-center mt-xs">Start your 14-day premium trial today.</p>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto px-margin-mobile pb-2xl">
<!-- Social Auth Section -->
<div class="flex flex-col gap-md mb-xl">
<button class="btn-interact w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center gap-md hover:bg-surface-container-low transition-colors shadow-sm">
<img alt="Google" class="w-6 h-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA35JWMDIaH6eaSYy4zqDPoUMTtVzMLvtWIqnAdBKn3nRm4xIz71HE-Bf8Iji7u0mGZkXonOdbTbLsBY6SEsuwZAwKi-EvIpoCEi86F9WqYAIbBcuzlC145gBf2NL8hFziyHUzQyntD4haNdzWGEKyJkaVt-d_sp2RAJkehULINaCfSIAY3FZStdgyBZWK8HAGO-MTZyq8iSJOegHjyenev6B-E8Kn2S6i2HSrCJ_YBB-GLu72eHzhcJlFXmDw1HJnnmdjz3F8NHkg"/>
<span class="font-label text-label-md text-on-surface">Sign Up with Google</span>
</button>
<button class="btn-interact w-full h-14 bg-[#1877F2] rounded-xl flex items-center justify-center gap-md hover:opacity-90 transition-opacity shadow-sm">
<svg class="w-6 h-6 fill-white" viewbox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
<span class="font-label text-label-md text-white">Sign Up with Facebook</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center gap-md mb-xl">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label text-label-sm text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Sign Up Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label-md text-on-surface-variant ml-xs" for="full_name">Full Name</label>
<div class="input-focus flex items-center bg-surface-container-lowest border border-outline-variant rounded-xl px-md h-14 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="person">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-outline font-body text-body-md" id="full_name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label-md text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="input-focus flex items-center bg-surface-container-lowest border border-outline-variant rounded-xl px-md h-14 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="mail">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-outline font-body text-body-md" id="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label-md text-on-surface-variant ml-xs" for="password">Password</label>
<div class="input-focus flex items-center bg-surface-container-lowest border border-outline-variant rounded-xl px-md h-14 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="lock">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-outline font-body text-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="pw_icon">visibility</span>
</button>
</div>
<p class="font-body text-[13px] text-on-surface-variant mt-xs ml-xs italic">Must be at least 8 characters.</p>
</div>
<!-- Primary CTA -->
<button class="btn-interact w-full h-14 bg-primary text-on-primary font-label text-label-md rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-sm mt-md" type="submit">
                Create Account
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Terms Notice -->
<p class="font-body text-[13px] text-on-surface-variant text-center mt-xl px-md">
            By clicking "Create Account", you agree to our 
            <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and 
            <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
        </p>
<!-- Login Link -->
<div class="mt-2xl text-center">
<p class="font-body text-body-md text-on-surface">
                Already have an account? 
                <a class="text-primary font-bold hover:underline ml-xs" href="#">Log in</a>
</p>
</div>
</main>
<!-- Decorative Bottom Gradient -->
<div class="fixed bottom-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary via-secondary to-primary-container"></div>
<!-- UI Scripts -->
<script>
        function togglePassword() {
            const pwInput = document.getElementById('password');
            const pwIcon = document.getElementById('pw_icon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                pwIcon.innerText = 'visibility_off';
            } else {
                pwInput.type = 'password';
                pwIcon.innerText = 'visibility';
            }
        }

        // Simple button active state feedback
        document.querySelectorAll('.btn-interact').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('opacity-90');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('opacity-90');
            });
        });
    </script>
</body></html>
