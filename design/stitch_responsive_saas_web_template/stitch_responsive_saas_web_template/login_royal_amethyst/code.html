<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - SaaSPro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "outline-variant": "#c1c6d5",
                "inverse-surface": "#2d3038",
                "tertiary-container": "#737575",
                "error-container": "#ffdad6",
                "tertiary": "#5a5c5c",
                "inverse-primary": "#efb0ff",
                "secondary-fixed": "#f8d8ff",
                "error": "#ba1a1a",
                "on-surface-variant": "#414753",
                "surface-container-highest": "#e0e2ec",
                "surface-container-lowest": "#ffffff",
                "on-secondary-container": "#640c87",
                "surface-container-high": "#e6e8f1",
                "on-primary": "#ffffff",
                "surface-container-low": "#f2f3fd",
                "background": "#f9f9ff",
                "surface-container": "#ecedf7",
                "on-tertiary-fixed-variant": "#454747",
                "tertiary-fixed": "#e2e2e2",
                "on-tertiary": "#ffffff",
                "on-background": "#181c22",
                "on-secondary": "#ffffff",
                "on-surface": "#181c22",
                "surface-bright": "#f9f9ff",
                "on-error": "#ffffff",
                "surface-variant": "#e0e2ec",
                "surface": "#f9f9ff",
                "inverse-on-surface": "#eff0fa",
                "surface-dim": "#d8dae3",
                "secondary-fixed-dim": "#ebb2ff",
                "secondary": "#893aab",
                "on-tertiary-fixed": "#1a1c1c",
                "tertiary-fixed-dim": "#c6c6c7",
                "primary-container": "#a64fc4",
                "on-tertiary-container": "#fcfcfc",
                "on-secondary-fixed-variant": "#6e1c91",
                "on-secondary-fixed": "#320047",
                "primary-fixed": "#fad7ff",
                "on-error-container": "#93000a",
                "surface-tint": "#8d36ab",
                "on-primary-fixed-variant": "#721791",
                "on-primary-container": "#fffbff",
                "secondary-container": "#db87fd",
                "primary": "#8a33a9",
                "on-primary-fixed": "#330045",
                "primary-fixed-dim": "#efb0ff",
                "outline": "#717785"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "margin-mobile": "16px",
                "container-max": "1280px"
        },
        "fontFamily": {
                "headline": ["Inter", "sans-serif"],
                "display": ["Inter", "sans-serif"],
                "body": ["Inter", "sans-serif"],
                "label": ["Inter", "sans-serif"]
        }
      },
    },
  }
</script>
<style>
        body {
            background-color: #f9f9ff;
            color: #181c22;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0px 4px 12px rgba(141, 54, 171, 0.08);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest flex items-center justify-center h-16 border-b border-outline-variant px-margin-mobile">
<span class="text-2xl font-bold text-primary tracking-tight">SaaSPro</span>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-24 pb-12">
<div class="w-full max-w-[400px] bg-surface-container-lowest rounded-xl p-8 login-card border border-outline-variant">
<!-- Headline -->
<div class="mb-10 text-center">
<h1 class="text-3xl font-bold text-on-surface mb-2">Login</h1>
<p class="text-sm text-on-surface-variant">Access your professional workspace</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-on-surface" for="email">Email Address</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline" id="email" name="email" placeholder="alex@saaspro.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-sm font-medium text-on-surface" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant flex items-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Sign In Button -->
<button class="w-full h-12 bg-primary text-on-primary font-semibold rounded-lg active:scale-[0.98] transition-all mt-2 shadow-sm hover:bg-opacity-90" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-xs font-medium text-on-surface-variant">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-4">
<button class="w-full h-12 flex items-center justify-center gap-2 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[#EA4335]" data-icon="google">google</span>
<span class="text-sm font-medium text-on-surface">Login with Google</span>
</button>
<button class="w-full h-12 flex items-center justify-center gap-2 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[#1877F2]" data-icon="facebook">social_leaderboard</span>
<span class="text-sm font-medium text-on-surface">Login with Facebook</span>
</button>
</div>
<!-- Sign Up Link -->
<div class="mt-10 text-center">
<p class="text-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full bg-surface-container-lowest border-t border-outline-variant py-6 px-margin-mobile">
<div class="flex flex-col items-center gap-2 max-w-container-max mx-auto">
<div class="flex gap-6">
<a class="text-xs font-medium text-on-surface-variant hover:text-primary transition-all" href="#">Privacy Policy</a>
<a class="text-xs font-medium text-on-surface-variant hover:text-primary transition-all" href="#">Terms of Service</a>
</div>
<p class="text-xs text-on-surface-variant opacity-70">© 2024 SaaSPro Inc. All rights reserved.</p>
</div>
</footer>
<script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwd.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add animation to the card on load
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.login-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
